<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="OLIVE Gents Salon">
  <!-- Outer border -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#48B040" stroke-width="5"/>
  <!-- Inner subtle border -->
  <rect x="18" y="18" width="364" height="364" fill="none" stroke="#48B040" stroke-width="1" opacity="0.3"/>

  <!-- Decorative top line accent -->
  <line x1="80" y1="70" x2="320" y2="70" stroke="#A08B3C" stroke-width="1" opacity="0.5"/>

  <!-- Main wordmark: "Olive" in italic serif, green -->
  <text x="200" y="240"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="148"
    fill="#48B040"
    font-weight="600"
    letter-spacing="-4">olive</text>

  <!-- Gold dot accent (the umlaut/brand mark over the O) -->
  <circle cx="97" cy="120" r="6" fill="#A08B3C"/>
  <circle cx="117" cy="110" r="4" fill="#A08B3C" opacity="0.6"/>

  <!-- Leaf / branch accent (right side) -->
  <g fill="#48B040" opacity="0.7">
    <path d="M 295 165 q 30 -18 60 -6 q -24 7 -44 18 z"/>
    <path d="M 288 190 q 32 -7 60 7 q -27 10 -48 15 z"/>
    <path d="M 293 215 q 28 -5 52 8 q -22 8 -40 10 z"/>
  </g>

  <!-- Decorative bottom line accent -->
  <line x1="80" y1="285" x2="320" y2="285" stroke="#A08B3C" stroke-width="1" opacity="0.5"/>

  <!-- Sub-wordmark: GENTS SALON in gold -->
  <text x="200" y="330"
    text-anchor="middle"
    font-family="Helvetica, Arial, sans-serif"
    font-size="28"
    fill="#A08B3C"
    letter-spacing="10"
    font-weight="400">GENTS SALON</text>
</svg>
